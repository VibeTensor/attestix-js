name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest (node-${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # Lockfile-only install (Scorecard PinnedDependencies). The lockfile is
        # regenerated from a clean tree so it carries every platform's optional
        # native binaries (npm/cli#4828); do not reintroduce an `npm install`
        # fallback here.
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run tests (vitest)
        run: npm test

      - name: Build (tsup)
        run: npm run build
