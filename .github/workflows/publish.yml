# Requires npm Trusted Publisher config on npmjs.com:
#   Package settings -> Trusted Publishers -> GitHub Actions
#   Repo: VibeTensor/attestix-js - Workflow: publish.yml - Environment: (none required)
# Until that is configured on the npm side, this workflow will fail at the publish step;
# that is the intended state (publish should be gated by trust on the npm side, not by a secret here).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write    # OIDC for npm trusted publishing
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish (OIDC, no token)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          registry-url: https://registry.npmjs.org

      # npm trusted publishing requires npm >=11.5.1 and Node >=22.14.0.
      # https://docs.npmjs.com/trusted-publishers/
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        # Lockfile-only install; see test.yml.
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm (provenance + public access)
        run: npm publish --provenance --access=public
